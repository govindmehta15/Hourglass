<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hourglass Component Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(ellipse at 50% 30%, #1c140a 0%, #0a0704 60%, #050302 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 60px 20px;
    font-family: Georgia, 'Times New Roman', serif;
  }
  h1 {
    color: #e6b93d;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 14px;
    opacity: 0.75;
    margin: 0;
  }
  .row {
    display: flex;
    gap: 60px;
    align-items: flex-end;
    flex-wrap: wrap;
    justify-content: center;
  }
  hourglass-controls {
    --hourglass-controls-color: #cbb27a;
    --hourglass-controls-accent: #e6b93d;
  }
</style>
</head>
<body>
  <h1>Realistic Golden Hourglass</h1>
  <div class="row">
    <hour-glass id="main" width="260" duration="10" sand-color="#e6b93d" wood-color="#7a4a24"></hour-glass>
    <hour-glass width="160" duration="7" sand-color="#f2c14e" wood-color="#8a5a2b"></hour-glass>
  </div>
  <hourglass-controls for="main"></hourglass-controls>

  <script src="hourglass.js"></script>
  <script src="hourglass-controls.js"></script>
</body>
</html>
